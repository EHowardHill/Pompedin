[package]
name = "pompedin"
version = "1.0.0"
edition = "2021"

[lib]
name = "pompedin_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pompedin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
base64 = "0.22"
uuid = { version = "1.23.2", features = ["v4"] }
chrono = "0.4"
open = "5.3.5"
